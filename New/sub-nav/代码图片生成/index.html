<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="../../vars.css">
</head>

<body>

    <main class="main-area flow-border">

        <div class="picture-area">

            <div class="code-area">
                <textarea id="code" style=""></textarea>
            </div>
        </div>

    </main>




    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-7ymO4nGrkm372HoSbq1OY2DP4pEZnMiA+E0F3zPr+JQQtQ82gQ1HPY3QIVtztVua" crossorigin="anonymous"></script>
    <script>
const textarea = document.getElementById("code");
const codeArea = document.querySelector(".code-area");

function adjustHeight() {
    // 重置 textarea 高度
    textarea.style.height = "auto";

    // 设置 textarea 高度为内容高度
    textarea.style.height = textarea.scrollHeight + "px";

    // 设置父容器最小高度以适应 textarea
    codeArea.style.minHeight = textarea.scrollHeight + "px";
}

// 页面加载时初始化
adjustHeight();

// 输入时自动调整高度
textarea.addEventListener("input", adjustHeight);
</script>
</body>
</html>

<style>
    *, html, body{
        font-family: "JetBrains Mono", sans-serif;
        font-variant-ligatures: common-ligatures;
        -webkit-font-variant-ligatures: common-ligatures;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        align-items: center;
        align-content: center;
        justify-content: center;
    }
    body {
        display: flex;
        background: var(--bg-color);
        align-content: center;
        align-items: center;
    }

    main {
        justify-content: normal;
    }

    .picture-area {
        display: flex;
        position: relative;
        width: 100%;
        min-height: 200px;
        height: auto;
        max-width: 1000px;
        padding: 60px;

        border-radius: 15px;

        background: var(--pure-colored-bg);
        transition: var(--transition);
    }

    .code-area {
        display: flex;
        flex-direction: column;
        position: relative;
        justify-content: flex-end;
        width: 100%;
        height: 100%;

        padding: 40px 25px 25px;
        transition: var(--transition);

        background: #1e1e2cAF;

        border-radius: 15px;
    }
    .code-area::after {
        display: flex;
        content: "";
        position: absolute;
        background-color: rgb(246, 113, 111); /* 红灯 */
        width: 15px;
        height: 15px;
        border-radius: 50%;
        left: 16px;
        top: 16px;


        /* 复制两个灯 */
        box-shadow:
                23px 0 rgb(242,202,68),   /* 黄灯 */
                46px 0 rgb(67, 198, 90);  /* 绿灯 */
    }
    #code {
        display: flex;
        position: relative;
        bottom: 0;
        width: 100%;
        min-height: 100%;
        height: auto;

        background: transparent;
        border: none;

        white-space: pre-wrap;
        word-break: keep-all;
        overflow-wrap: break-word;
        -webkit-font-smoothing: antialiased;
        resize: none;

        transition: var(--transition);

    }




</style>
