<style>
    *, html, body{
        font-family: "JetBrains Mono", sans-serif;
        font-variant-ligatures: common-ligatures;
        -webkit-font-variant-ligatures: common-ligatures;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        align-items: center;
        align-content: center;
        justify-content: center;
    }
    body {
        display: flex;
        background: var(--bg-color);
        align-content: center;
        align-items: center;
    }

    main {
        justify-content: normal;
    }

    .picture-area {
        display: flex;
        position: relative;
        width: 100%;
        min-height: 200px;
        height: auto;
        max-width: 1000px;
        padding: 60px;

        border-radius: 15px;

        background: var(--pure-colored-bg);
        transition: var(--transition);
    }

    .code-area {
        /*display: flex;*/
        /*flex-direction: column;*/
        position: relative;
        /*justify-content: flex-end;*/
        width: 100%;
        height: 100%;

        padding: 40px 25px 25px;
        transition: var(--transition);

        background: #1e1e2cAF;

        border-radius: 15px;
    }
    .code-area::after {
        display: flex;
        content: "";
        position: absolute;
        background-color: rgb(246, 113, 111); /* 红灯 */
        width: 15px;
        height: 15px;
        border-radius: 50%;
        left: 16px;
        top: 16px;


        /* 复制两个灯 */
        box-shadow:
                23px 0 rgb(242,202,68),   /* 黄灯 */
                46px 0 rgb(67, 198, 90);  /* 绿灯 */
    }


    #code, pre {

    }
