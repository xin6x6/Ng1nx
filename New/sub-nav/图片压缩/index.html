<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../../vars.css">
</head>
<body>
    <div class="submit-container">
        <input id="submit" type="file"/>
    </div>

    <div class="slider">
        <label id="qualityLabel" for="compress-degree">压缩程度: 50</label>
        <input id="compress-degree" type="range" min="1" max="100" value="50">
    </div>

    <button id="download" class="flow-border"> 转换并下载 </button>

    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.9.5/dist/ffmpeg.min.js"></script>
<!--    <script src="./ffmpeg.js"></script>-->
    <script src="./script.js"></script>
</body>
</html>

<style>
    body, html {
        padding: 0;
        margin: 0;
        background: var(--bg-color);
        align-content: center;
        align-items: center;
        display: flex;
        justify-content: center;
        width: 100%;
        height: 100%;
        flex-direction: column;
    }




    .submit-container {
        position: relative; /* ✅ 关键：伪元素相对这个容器定位 */
        width: 200px;
        height: 200px;
        display: flex;
        background: var(--colored-bg);
        border: solid 1px transparent;
        border-radius: 25px;
        align-content: center;
        transition: var(--transition);

        box-shadow: var(--shadow);

        input {
            position: relative;
            width: inherit;
            height: inherit;
            border-radius: inherit;
            opacity: 0;
            z-index: 2;
            top: 0;
            left: 0;
        }
    }
    .submit-container::before {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50px;
        height: 50px;
        z-index: 0;
        display: flex;              /* ✅ 启用 Flex */
        align-items: center;        /* ✅ 垂直居中 */
        justify-content: center;    /* ✅ 水平居中 */
        content: var(--icon114, "+");
        /*content: "✓";*/
        font-size: 5rem;
        opacity: 50%;
    }
    .submit-container:hover {
        box-shadow: var(--colored-shadow-hovering);
        transform: scale(1.01);
    }
    .submit-container:active {
        box-shadow: var(--shadow);
        transform: scale(0.99);
    }

    #download {
        width: 150px;
        height: 50px;
        background: var(--colored-bg);
        border: solid 1px transparent;
        border-radius: 25px;
        font-size: 18px;
        box-shadow: var(--shadow);

        transition: var(--transition);
    }
    #download:hover {
        box-shadow: var(--colored-shadow-hovering);
        transform: scale(1.01);
    }
    #download:active {
        box-shadow: var(--shadow);
        transform: scale(0.99);
    }


</style>
