<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../../vars.css">
</head>
<body>
    <div class="submit">
        <input type="file"/>
    </div>


</body>
</html>

<style>
    body, html {
        padding: 0;
        margin: 0;
        background: var(--bg-color);
        align-content: center;
        align-items: center;
        display: flex;
        justify-content: center;
        width: 100%;
        height: 100%;
        flex-direction: column;
    }




    .submit {
        position: relative; /* ✅ 关键：伪元素相对这个容器定位 */
        width: 200px;
        height: 200px;
        display: flex;
        background: var(--colored-bg);
        border: solid 1px transparent;
        border-radius: 25px;
        align-content: center;
        transition: var(--transition);

        box-shadow: var(--shadow);

        input {
            position: relative;
            width: inherit;
            height: inherit;
            border-radius: inherit;
            opacity: 0;
            z-index: 2;
            top: 0;
            left: 0;
        }
    }
    .submit::before {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50px;
        height: 50px;
        z-index: 0;
        display: flex;              /* ✅ 启用 Flex */
        align-items: center;        /* ✅ 垂直居中 */
        justify-content: center;    /* ✅ 水平居中 */
        content: "+";
        /*content: "✓";*/
        font-size: 5rem;
        opacity: 50%;
    }
    .submit:hover {
        box-shadow: var(--colored-shadow-hovering);
        transform: scale(1.01);
    }
    .submit:active {
        box-shadow: var(--shadow);
        transform: scale(0.99);
    }
</style>
