<!DOCTYPE html>
<html lang="en">



<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Ng1nx的主页!</title>
    <link rel="stylesheet" href="./vars.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>

    <div class="notification-container">
        <div class="notification">
            <h2>¡UI更新!</h2>
            <article>
                <span>更新了网站的所有UI</span>
            </article>
        </div>
        <button id="confirmNotification">抄收</button>
    </div>

    <div class="body-container">
        <header>
            <h1 class="animate__animated animate__bounceIn" style="font-size:45px;">Ng1nx的个人主页
            </h1>
            <script type="text/javascript">
                function show_runtime() {
                    window.setTimeout('show_runtime()', 1000);
                    X = new Date("9/21/2025 11:16:20");
                    Y = new Date();
                    T = (Y.getTime() - X.getTime());
                    M = 24*60*60*1000;
                    a = T / M;
                    A = Math.floor(a);
                    b = (a - A) * 24;
                    B = Math.floor(b);
                    c = (b - B) * 60;
                    C = Math.floor((b - B) * 60);
                    D = Math.floor((c - C) * 60);
                    rt.innerHTML =  A + '天' + B + '小时' + C + '分' + D + '秒';
                }
                show_runtime();
            </script>
        </header>

        <main>
            <box>
                <title>欢迎</title>
                <content>
                    <span class="h-center">Welcome</span>
                </content>
            </box>
            <box>
                <title>网站信息</title>
                <content>
                    <span>浏览人数: <uv id="page_uv"/></span>
                    <span>浏览人次: <pv id="page_pv"/> </span>
                    <span>运行时间: <rt id="rt"/> </span>
                    <!--                -->
                </content>
            </box>
            <box>
                <title>联系我</title>
                <content>
                    <a class="rick-roll" href="https://www.bilibili.com/video/BV1UT42167xb/?spm_id_from=333.337.search-card.all.click" type="button" target="_blank">BiliBili</a>
                </content>
            </box>
            <box class="sub-nav" data-url="进制转换">
                <title>工具</title>
                <content>
                    <h1>进制转换</h1>
                </content>
            </box>
            <box class="sub-nav" data-url="图片压缩">
                <title>工具</title>
                <content>
                    <h1>图片压缩</h1>
                </content>
            </box>
        </main>

    </div>


    <script defer src="//webviso.yestool.org/js/index.min.js"></script>
    <script src="script.js"></script>
</body>

</html>

<style>
    @font-face {
        font-family: 'Comfortaa';
        src: url(./font/Comfortaa.ttf);
    }

    * {
        font-family: 'Comfortaa', 'sans-serif';
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    .body-container {
        background: var(--bg-color);
        padding: 20px;
        height: 100vh;                  /* 让 body 高度占满屏幕 */
        /*display: grid;*/
        /*place-items: normal;            !* 水平 + 垂直居中 *!*/
        overflow-x: hidden;
        header {
            animation: fadeInDown 0.8s ease-out;
            margin-bottom: 50px;

            h1 {
                font-size: 2.8rem;
                text-align: center;
                background: var(--gradient);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                margin-top: 5px;
                margin-bottom: 15px;
                font-weight: 700;
                letter-spacing: -0.5px;
                position: relative;
                display: block;
            }

            h1::after {
                content: "";
                position: absolute;
                bottom: -10px;
                left: 50%;
                transform: translateX(-50%);
                width: 120px;
                height: 4px;
                background: var(--gradient);
                border-radius: 2px;
            }
        }
    }

    .h-center {
        display: flex;
        justify-content: center;
    }

    main {
        margin: 0 15px;
        display: grid;
        grid-template-columns: repeat( auto-fit , minmax(400px, 0fr));
        gap: 20px;
        justify-content: center; /* 居中整个网格 */

        box {
            display: flex;
            flex-direction: column;
            position: relative;
            align-content: center;
            min-width: 400px;
            max-width: 400px;
            min-height: 230px;
            height: auto;
            background-color: var(--box-bg);
            border-radius: 25px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            title {
                display: block;
                position: relative;
                width: 100%;
                height: auto;
                top: 20px;
                font-size: 30px;
                justify-content: center;
                text-align: center;
            }
            content {
                display: block;
                position: relative;
                width: 100%;
                height: auto;
                top: 40px;
                text-align: center;
                justify-items: center;

                color: var(--black);
                span {
                    display: block;
                    font-size: 25px;
                }
                h1 {
                    display: block;
                    position: relative;
                    width: 60%;
                    height: 80px;
                    color: var(--black);
                    border-radius: 25px;
                }
            }
        }
        box::after {
            display: flex;
            content: "";
            position: absolute;
            background-color: rgb(246, 113, 111); /* 红灯 */
            width: 15px;
            height: 15px;
            border-radius: 50%;
            left: 15px;
            top: 15px;

            /* 复制两个灯 */
            box-shadow:
                    23px 0 rgb(242,202,68),   /* 黄灯 */
                    46px 0 rgb(67, 198, 90);  /* 绿灯 */
        }
        box:hover {
            box-shadow: var(--shadow-hovering);
            transform: scale(1.02);
        }
        box:active {
            box-shadow: var(--shadow);
            transform: scale(0.99);
        }
        .sub-nav {
            user-select: none;
        }
    }

    button, .rick-roll {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 28px;
        background: var(--gradient);
        color: white;
        text-decoration: none;
        border-radius: 50px;
        font-weight: 500;
        transition: var(--transition);
        border: none;
        position: relative;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        gap: 8px;
        user-select: none;
    }
    button, .rick-roll:hover {
        box-shadow: var(--shadow-hovering);
        transform: scale(1.1);
    }
    button, .rick-roll:active {
        box-shadow: var(--shadow);
        transform: scale(0.99);
    }

    .notification-container { /*bg*/
        position: absolute;
        width: 100vw;
        height: 100vh;
        top: 0;
        left: 0;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 1;
        align-content: center;
        justify-content: center;
        align-items: center;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: var(--transition);
        animation: fadeIn 0.2s ease-in-out;

        .notification {
            top: 20px;
            position: relative;
            width: 600px;
            height: 800px;
            background: var(--box-bg);
            box-shadow: var(--shadow);
            border-radius: 25px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;

            article {
                color: var(--black);
                top: 10px;
                font-size: 22px;
            }

            h2 {
                text-align: center;
                display: block;
                position: relative;
                width: 100%;
            }

        }
        button {
            display: inline-flex;
            align-items: flex-end;
            justify-content: center;
            padding: 12px 28px;
            background: var(--gradient);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 500;
            transition: var(--transition);
            border: none;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
            gap: 8px;
            z-index: 1;
            top: -50px;
        }
        button:hover {
            box-shadow: var(--shadow-hovering);
            transform: scale(1.1);
        }
        button:active {
            box-shadow: var(--shadow);
            transform: scale(0.99);
        }
    }



</style>
