<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Ng1nx的主页!</title>
    <link rel="stylesheet" href="./vars.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>

<body>
    <header>
        <h1 class="h-center animate__animated animate__bounceIn" style="font-size:45px;">Ng1nx的个人主页
        </h1>
    </header>

    <main>
        <box>
           <span>title</span>
        </box>
        <box>
            <span>Title</span>
        </box>
    </main>

</body>

</html>

<style>
    @font-face {
        font-family: 'Comfortaa';
        src: url(./font/Comfortaa.ttf);
    }

    * {
        font-family: 'Comfortaa', 'sans-serif';
    }

    body {
        background: var(--bg-color);
        padding: 20px;
        height: 100vh;                  /* 让 body 高度占满屏幕 */
        display: grid;
        /*place-items: center;            !* 水平 + 垂直居中 *!*/

        header {
            animation: fadeInDown 0.8s ease-out;
            margin-bottom: 50px;

            h1 {
                font-size: 2.8rem;
                background: var(--gradient);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                margin-top: 5px;
                margin-bottom: 15px;
                font-weight: 700;
                letter-spacing: -0.5px;
                position: relative;
                display: inline-block;
            }

            h1::after {
                content: "";
                position: absolute;
                bottom: -10px;
                left: 50%;
                transform: translateX(-50%);
                width: 120px;
                height: 4px;
                background: var(--gradient);
                border-radius: 2px;
            }
        }
    }

    .h-center {
        display: flex;
        justify-content: center;
    }

    main {
        margin: 0 15px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 20px;
        justify-content: center; /* 居中整个网格 */
    }

    box {
        display: flex;
        position: relative;
        align-content: center;
        min-width: 400px;
        max-width: 400px;
        min-height: 230px;
        background-color: var(--box-bg);
        border-radius: 25px;
        box-shadow: var(--shadow);
        transition: var(--transition);
        span {
            display: block;
            position: relative;
            width: 100%;
            height: auto;

            justify-content: center;
            text-align: center;
        }
    }
    box::after {
        display: flex;
        content: "";
        position: absolute;
        background-color: rgb(246, 113, 111); /* 红灯 */
        width: 15px;
        height: 15px;
        border-radius: 50%;
        left: 15px;
        top: 15px;

        /* 复制两个灯 */
        box-shadow:
                23px 0 rgb(242,202,68),   /* 黄灯 */
                46px 0 rgb(67, 198, 90);  /* 绿灯 */
    }



    box:hover {
        box-shadow: var(--shadow-hovering);
        transform: scale(1.02);
    }

    box:active {
        box-shadow: var(--shadow);
        transform: scale(0.99);
    }
</style>
