                function show_runtime() {
                    window.setTimeout('show_runtime()', 1000);
                    X = new Date("9/21/2025 11:16:20");
                    Y = new Date();
                    T = (Y.getTime() - X.getTime());
                    M = 24*60*60*1000;
                    a = T / M;
                    A = Math.floor(a);
                    b = (a - A) * 24;
                    B = Math.floor(b);
                    c = (b - B) * 60;
                    C = Math.floor((b - B) * 60);
                    D = Math.floor((c - C) * 60);
                    rt.innerHTML =  A + '天' + B + '小时' + C + '分' + D + '秒';
                }
                show_runtime();
            </script>

<style>
    * {
        font-family: 'Comfortaa', 'sans-serif';
    }
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }


    .body-container {
        transition: var(--transition);
        background: var(--bg-color);
        padding: 20px;
        height: 100vh;                  /* 让 body 高度占满屏幕 */
        /*display: grid;*/
        /*place-items: normal;            !* 水平 + 垂直居中 *!*/
        overflow-x: hidden;
        header {
            animation: fadeInDown 0.8s ease-out;
            margin-bottom: 50px;

            h1 {
                z-index: 0 !important;
                font-size: 2.8rem;
                text-align: center;
                background: var(--gradient);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                margin-top: 5px;
                margin-bottom: 15px;
                font-weight: 700;
                letter-spacing: -0.5px;
                position: relative;
                display: block;
                user-select: none;
            }

            h1::after {
                content: "";
                position: absolute;
                bottom: -10px;
                left: 50%;
                transform: translateX(-50%);
                width: 120px;
                height: 4px;
                background: var(--gradient);
                border-radius: 2px;
            }
        }
    }


    main {
        margin: 0 15px;
        display: grid;
        grid-template-columns: repeat( auto-fit , minmax(400px, 0fr));
        gap: 20px;
        justify-content: center; /* 居中整个网格 */
        transition: var(--transition);

        box {

            display: flex;
            flex-direction: column;
            position: relative;
            align-content: center;
            background: var(--colored-bg);
            overflow: hidden;
            /*background: var(--box-bg);*/
            backdrop-filter: blur(10px);
            min-width: 400px;
            max-width: 400px;
            min-height: 230px;
            height: auto;

            padding: 1px;

            /*border: 1px solid transparent;*/
            border-radius: 25px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            title {
                display: block;
                position: relative;
                width: 100%;
                height: auto;
                top: 20px;
                font-size: 30px;
                justify-content: center;
                text-align: center;
            }
            content {
                display: block;
                position: relative;
                width: 100%;
                height: auto;
                top: 40px;
                text-align: center;
                justify-items: center;
                justify-content: center;
                justify-self: center;
                align-content: center;
                align-self: center;
                align-items: center;

                transition: var(--transition);

                color: var(--black);
                span {
                    display: block;
                    font-size: 25px;
                    transition: var(--transition);
                }
                h1{
                    display: inline-block;
                    position: relative;
                    width: 60%;
                    height: auto;
                    color: var(--black);
                    border-radius: 25px;
                    horiz-align: center;
                    transition: var(--transition);
                }
            }
        }

        box::after {
            display: flex;
            content: "";
            position: absolute;
            background-color: rgb(246, 113, 111); /* 红灯 */
            width: 15px;
            height: 15px;
            border-radius: 50%;
            left: 16px;
            top: 16px;


            /* 复制两个灯 */
            box-shadow:
                    23px 0 rgb(242,202,68),   /* 黄灯 */
                    46px 0 rgb(67, 198, 90);  /* 绿灯 */
        }
        box:hover {
            box-shadow: var(--colored-shadow);
            /*box-shadow: var(--shadow-hovering);*/
            transform: scale(1.02);
            --border-width: 2px;
        }
        box:active {
            box-shadow: var(--shadow);
            transform: scale(0.99);
        }
        .sub-nav {
            user-select: none;
        }
    }


    .notification-container { /*bg*/
        position: absolute;
        width: 100vw;
        height: 100vh;
        top: 0;
        left: 0;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 2;
        align-content: center;
        justify-content: center;
        align-items: center;
        /*display: flex;*/
        display: none;
        flex-direction: column;
        overflow: hidden;
        transition: var(--transition);
        animation: fadeIn 0.2s ease-in-out;

        .notification {
            top: 20px;
            position: relative;
            width: 600px;
            height: 800px;
            background: var(--box-bg);
            box-shadow: var(--shadow);
            border-radius: 25px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;

            article {
                color: var(--black);
                top: 10px;
                font-size: 22px;
            }

            h2 {
                text-align: center;
                display: block;
                position: relative;
                width: 100%;
            }

        }
    }
    .navbar-container {
        position: absolute;
        display: flex;
        top: 15px;
        left: 0;
        width: 100%;
        height: 60px;
        align-items: center;
        /*background: var(--black);*/


        .navbar-left {
            z-index: 1;
            --left-center: calc(100vw/4 - 100px);
            display: flex;
            position: relative;
            min-width: 60px;
            height: 100%;
            /*gap: 16px;*/
            box-shadow: var(--shadow);
            user-select: none;

            transform-origin: center;
            left: var(--left-center);
            background: var(--colored-bg);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease-in-out;
            transition: var(--transition);
            border-radius: 30px;
            padding-left: 4px;
            padding-right: 4px;

            img, svg {
                animation: fadeIn 0.2s ease-in-out;
                transition: var(--transition);
                display: block;
                position: relative;
                padding: 8px;
                height: 60%;   /* 高度 = 父容器高度的 60% */
                width: 60%;    /* 宽度 = 父容器高度的 60% */
                aspect-ratio: 1 / 1; /* 保证宽高比一致 */
            }
            img, svg:hover {
                transform: scale(1.05);
            }
            img, svg:active {
                transform: scale(0.99);
            }
        }

        .navbar-right {
            z-index: 1;
            --right-center: calc(75vw - 100px);
            display: flex;
            /*justify-self: flex-end;*/
            position: relative;
            min-width: 60px;
            height: 100%;
            /*gap: 16px;*/
            box-shadow: var(--shadow);
            user-select: none;

            transform-origin: center;
            left: var(--right-center);
            background: var(--colored-bg);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease-in-out;
            transition: var(--transition);
            border-radius: 30px;
            padding-left: 4px;
            padding-right: 4px;

            img, svg {
                animation: fadeIn 0.2s ease-in-out;
                transition: var(--transition);
                display: block;
                position: relative;
                padding: 8px;
                height: 60%;   /* 高度 = 父容器高度的 60% */
                width: 60%;    /* 宽度 = 父容器高度的 60% */
                aspect-ratio: 1 / 1; /* 保证宽高比一致 */
            }
            img, svg:hover {
                transform: scale(1.05);
            }
            img, svg:active {
                transform: scale(0.99);
            }
        }

    }
</style>
